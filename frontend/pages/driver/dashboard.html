<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Driver Dashboard — Wells Fargo CMS</title>
    <link rel="stylesheet" href="../../assets/css/style.css"/>
</head>
<body>
<div class="app-layout">
    <aside class="sidebar">
        <div class="sidebar-logo">
            <span class="sidebar-logo-icon">🚚</span>
            <div class="sidebar-logo-text">
                <span class="sidebar-logo-title">Wells Fargo CMS</span>
                <span class="sidebar-logo-sub">Nairobi CBD Branch</span>
            </div>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section">Driver</div>
            <a class="nav-link active" href="dashboard.html">
                <span class="nav-icon">📦</span> My Deliveries
            </a>
            <a class="nav-link" href="update_status.html">
                <span class="nav-icon">🔄</span> Update Status
            </a>
        </nav>
        <div class="sidebar-footer">
            <div class="sidebar-user">
                <div class="sidebar-avatar" id="userAvatar">DR</div>
                <div>
                    <div class="sidebar-user-name" id="userName">—</div>
                    <div class="sidebar-user-role" id="userRole">—</div>
                </div>
            </div>
            <a class="logout-btn" onclick="logout()">🚪 Logout</a>
        </div>
    </aside>

    <main class="main-content">
        <div class="page-header page-header-row">
            <div>
                <h1>My Deliveries</h1>
                <p id="welcomeMsg">Welcome back</p>
            </div>
            <button class="btn btn-primary"
                    onclick="location.href='update_status.html'">
                🔄 Update Status
            </button>
        </div>

        <div class="alert alert-error" id="alertError"></div>

        <div class="stats-grid"
             style="grid-template-columns:repeat(2,1fr);max-width:400px;">
            <div class="stat-card">
                <div class="stat-icon-wrap amber">📦</div>
                <div class="stat-info">
                    <div class="stat-value" id="statActive">—</div>
                    <div class="stat-label">Active Deliveries</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon-wrap green">✅</div>
                <div class="stat-info">
                    <div class="stat-value" id="statDone">—</div>
                    <div class="stat-label">Completed</div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h2>My Assigned Parcels</h2>
                <button class="btn btn-outline btn-sm"
                        onclick="location.href='update_status.html'">
                    Update Status →
                </button>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Tracking No.</th>
                            <th>Recipient</th>
                            <th>Address</th>
                            <th>Zone</th>
                            <th>Weight</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="parcelsTable"></tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/auth.js"></script>
<script>
let currentUser = null;

async function init() {
    currentUser = await checkAuth('driver');
    if (!currentUser) return;
    populateSidebar(currentUser);
    document.getElementById('welcomeMsg').textContent =
        `Welcome, ${currentUser.full_name}`;
    await loadParcels();
}

async function loadParcels() {
    try {
        const res = await API.dispatch.getByDriver(currentUser.user_id);
        const parcels = res.data || [];

        const active = parcels.filter(p =>
            !['Delivered','Failed'].includes(p.status));
        const done   = parcels.filter(p => p.status === 'Delivered');

        document.getElementById('statActive').textContent = active.length;
        document.getElementById('statDone').textContent   = done.length;

        const tbody = document.getElementById('parcelsTable');
        if (!parcels.length) {
            tbody.innerHTML = `<tr><td colspan="6">
                <div class="empty-state">
                    <div class="empty-state-icon">📦</div>
                    <h3>No parcels assigned yet</h3>
                    <p>The dispatch officer will assign parcels to you</p>
                </div></td></tr>`;
            return;
        }

        tbody.innerHTML = parcels.map(p => `
            <tr>
                <td>${trackingBadge(p.tracking_number)}</td>
                <td><strong>${p.recipient_name}</strong></td>
                <td style="font-size:12px;
                     color:var(--color-text-secondary);">
                    ${p.recipient_address}</td>
                <td>${p.zone}</td>
                <td>${p.weight} kg</td>
                <td>${statusBadge(p.status)}</td>
            </tr>
        `).join('');
    } catch(e) {
        showAlert('alertError', 'Failed to load parcels.', 'error');
    }
}

init();
</script>
</body>
</html>
